<svg width="60" height="80" viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Sunshine Flag on Post -->
  <!-- Flag post -->
  <rect x="8" y="5" width="3" height="70" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <!-- Flag -->
  <g transform="translate(11, 5)">
    <!-- Flag background -->
    <rect x="0" y="0" width="35" height="24" fill="#F39C12" stroke="#D68910" stroke-width="1"/>
    <!-- Sun -->
    <circle cx="17.5" cy="12" r="6" fill="#F1C40F"/>
    <!-- Sun rays -->
    <line x1="17.5" y1="3" x2="17.5" y2="0" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17.5" y1="21" x2="17.5" y2="24" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8.5" y1="12" x2="5.5" y2="12" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26.5" y1="12" x2="29.5" y2="12" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11" y1="5.5" x2="9" y2="3.5" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="18.5" x2="26" y2="20.5" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="5.5" x2="26" y2="3.5" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11" y1="18.5" x2="9" y2="20.5" stroke="#F1C40F" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Wavy edge -->
    <path d="M 35,0 Q 37,6 35,12 Q 37,18 35,24 L 35,0" fill="#E67E22" stroke="#D68910" stroke-width="0.5"/>
  </g>
</svg>

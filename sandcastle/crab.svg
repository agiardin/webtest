<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Red Crab -->
  <g transform="translate(30, 30)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
    <!-- Eyes -->
    <g transform="translate(-6, -8)">
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#C0392B" stroke-width="2"/>
      <circle cx="0" cy="-6" r="2.5" fill="#F8F9F9" stroke="#C0392B" stroke-width="1"/>
      <circle cx="0" cy="-6" r="1.2" fill="#2C3E50"/>
    </g>
    <g transform="translate(6, -8)">
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#C0392B" stroke-width="2"/>
      <circle cx="0" cy="-6" r="2.5" fill="#F8F9F9" stroke="#C0392B" stroke-width="1"/>
      <circle cx="0" cy="-6" r="1.2" fill="#2C3E50"/>
    </g>
    <!-- Left claw -->
    <g transform="translate(-12, -2)">
      <ellipse cx="-5" cy="0" rx="5" ry="4" fill="#EC7063" stroke="#C0392B" stroke-width="1"/>
      <path d="M -8,-2 L -12,-4 L -11,-1 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
      <path d="M -8,2 L -12,4 L -11,1 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
    </g>
    <!-- Right claw -->
    <g transform="translate(12, -2)">
      <ellipse cx="5" cy="0" rx="5" ry="4" fill="#EC7063" stroke="#C0392B" stroke-width="1"/>
      <path d="M 8,-2 L 12,-4 L 11,-1 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
      <path d="M 8,2 L 12,4 L 11,1 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
    </g>
    <!-- Legs -->
    <line x1="-8" y1="5" x2="-12" y2="10" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="7" x2="-6" y2="12" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="0" y2="13" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="7" x2="6" y2="12" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="5" x2="12" y2="10" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
    <!-- Shell patterns -->
    <circle cx="-3" cy="-2" r="1" fill="#C0392B" opacity="0.3"/>
    <circle cx="3" cy="-2" r="1" fill="#C0392B" opacity="0.3"/>
    <circle cx="0" cy="2" r="1" fill="#C0392B" opacity="0.3"/>
  </g>
</svg>

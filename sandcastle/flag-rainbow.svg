<svg width="60" height="80" viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Rainbow Flag on Post -->
  <!-- Flag post -->
  <rect x="8" y="5" width="3" height="70" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <!-- Flag -->
  <g transform="translate(11, 5)">
    <!-- Rainbow stripes -->
    <rect x="0" y="0" width="35" height="4" fill="#E74C3C"/>
    <rect x="0" y="4" width="35" height="4" fill="#E67E22"/>
    <rect x="0" y="8" width="35" height="4" fill="#F1C40F"/>
    <rect x="0" y="12" width="35" height="4" fill="#2ECC71"/>
    <rect x="0" y="16" width="35" height="4" fill="#3498DB"/>
    <rect x="0" y="20" width="35" height="4" fill="#9B59B6"/>
    <!-- Flag border -->
    <rect x="0" y="0" width="35" height="24" fill="none" stroke="#34495E" stroke-width="1" opacity="0.3"/>
    <!-- Wavy edge -->
    <path d="M 35,0 Q 37,4 35,8 Q 37,12 35,16 Q 37,20 35,24 L 35,0" fill="none" stroke="#34495E" stroke-width="0.5"/>
  </g>
</svg>

<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Clam Shell -->
  <g transform="translate(30, 35)">
    <!-- Bottom shell -->
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#E8DAEF" stroke="#BB8FCE" stroke-width="2"/>
    <!-- Ridges on bottom -->
    <path d="M -15,-8 Q 0,-5 15,-8" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <path d="M -12,-4 Q 0,-2 12,-4" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <path d="M -10,0 Q 0,2 10,0" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <path d="M -8,4 Q 0,6 8,4" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <!-- Top shell (slightly open) -->
    <ellipse cx="0" cy="-10" rx="18" ry="12" fill="#D7BDE2" stroke="#BB8FCE" stroke-width="2"/>
    <!-- Ridges on top -->
    <path d="M -14,-15 Q 0,-13 14,-15" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <path d="M -12,-12 Q 0,-10 12,-12" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <path d="M -10,-8 Q 0,-6 10,-8" stroke="#BB8FCE" stroke-width="1" fill="none"/>
    <!-- Pearl inside -->
    <circle cx="0" cy="-5" r="4" fill="#F8F9F9" opacity="0.9"/>
    <circle cx="0" cy="-5" r="4" fill="url(#pearlGradient)"/>
    <!-- Hinge -->
    <rect x="-3" y="-2" width="6" height="3" fill="#A569BD" rx="1"/>
  </g>
  <defs>
    <radialGradient id="pearlGradient">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8DAEF"/>
    </radialGradient>
  </defs>
</svg>

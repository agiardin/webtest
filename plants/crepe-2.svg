<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Crepe Myrtle Stage 2: Flowering -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 85)">
    <!-- Trunk -->
    <rect x="-4" y="-50" width="8" height="65" fill="#795548"/>
    <!-- Leaves -->
    <ellipse cx="-14" cy="-40" rx="14" ry="18" fill="#81c784" transform="rotate(-40)"/>
    <ellipse cx="14" cy="-40" rx="14" ry="18" fill="#9ccc65" transform="rotate(40)"/>
    <ellipse cx="-16" cy="-25" rx="16" ry="20" fill="#81c784" transform="rotate(-45)"/>
    <ellipse cx="16" cy="-25" rx="16" ry="20" fill="#9ccc65" transform="rotate(45)"/>
    <!-- Flower clusters -->
    <g transform="translate(0, -50)">
      <circle cx="-3" cy="-3" r="3" fill="#ec407a"/>
      <circle cx="3" cy="-3" r="3" fill="#f06292"/>
      <circle cx="-3" cy="3" r="3" fill="#f48fb1"/>
      <circle cx="3" cy="3" r="3" fill="#ec407a"/>
      <circle cx="0" cy="0" r="3" fill="#f06292"/>
    </g>
  </g>
</svg>
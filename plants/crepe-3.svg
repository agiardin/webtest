<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Crepe Myrtle Stage 3: Full bloom -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 88)">
    <!-- Trunk -->
    <rect x="-5" y="-60" width="10" height="72" fill="#795548"/>
    <!-- Leaves -->
    <ellipse cx="-16" cy="-50" rx="14" ry="18" fill="#81c784" transform="rotate(-40)"/>
    <ellipse cx="16" cy="-50" rx="14" ry="18" fill="#9ccc65" transform="rotate(40)"/>
    <ellipse cx="-18" cy="-35" rx="16" ry="20" fill="#81c784" transform="rotate(-45)"/>
    <ellipse cx="18" cy="-35" rx="16" ry="20" fill="#9ccc65" transform="rotate(45)"/>
    <!-- Multiple flower clusters -->
    <g transform="translate(-8, -58)">
      <circle cx="-2" cy="-2" r="2.5" fill="#ec407a"/>
      <circle cx="2" cy="-2" r="2.5" fill="#f06292"/>
      <circle cx="-2" cy="2" r="2.5" fill="#f48fb1"/>
      <circle cx="2" cy="2" r="2.5" fill="#ec407a"/>
      <circle cx="0" cy="0" r="2.5" fill="#f06292"/>
    </g>
    <g transform="translate(8, -58)">
      <circle cx="-2" cy="-2" r="2.5" fill="#ec407a"/>
      <circle cx="2" cy="-2" r="2.5" fill="#f06292"/>
      <circle cx="-2" cy="2" r="2.5" fill="#f48fb1"/>
      <circle cx="2" cy="2" r="2.5" fill="#ec407a"/>
      <circle cx="0" cy="0" r="2.5" fill="#f06292"/>
    </g>
    <g transform="translate(0, -62)">
      <circle cx="-2" cy="-2" r="2.5" fill="#ec407a"/>
      <circle cx="2" cy="-2" r="2.5" fill="#f06292"/>
      <circle cx="-2" cy="2" r="2.5" fill="#f48fb1"/>
      <circle cx="2" cy="2" r="2.5" fill="#ec407a"/>
      <circle cx="0" cy="0" r="2.5" fill="#f06292"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rose Stage 1: Growing bush -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 80)">
    <!-- Stem -->
    <rect x="-3" y="-35" width="6" height="50" fill="#558b2f"/>
    <!-- Leaves -->
    <ellipse cx="-10" cy="-25" rx="12" ry="16" fill="#66bb6a" transform="rotate(-35)"/>
    <ellipse cx="10" cy="-25" rx="12" ry="16" fill="#81c784" transform="rotate(35)"/>
    <ellipse cx="-12" cy="-10" rx="14" ry="18" fill="#66bb6a" transform="rotate(-40)"/>
    <ellipse cx="12" cy="-10" rx="14" ry="18" fill="#81c784" transform="rotate(40)"/>
  </g>
</svg>
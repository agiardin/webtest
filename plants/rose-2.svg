<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rose Stage 2: Budding -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 82)">
    <!-- Stem -->
    <rect x="-3" y="-45" width="6" height="60" fill="#558b2f"/>
    <!-- Leaves -->
    <ellipse cx="-12" cy="-30" rx="14" ry="18" fill="#66bb6a" transform="rotate(-40)"/>
    <ellipse cx="12" cy="-30" rx="14" ry="18" fill="#81c784" transform="rotate(40)"/>
    <ellipse cx="-14" cy="-10" rx="16" ry="20" fill="#66bb6a" transform="rotate(-45)"/>
    <ellipse cx="14" cy="-10" rx="16" ry="20" fill="#81c784" transform="rotate(45)"/>
    <!-- Rose bud -->
    <circle cx="0" cy="-45" r="8" fill="#e57373"/>
  </g>
</svg>
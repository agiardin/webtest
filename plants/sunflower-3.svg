<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sunflower Stage 3: Blooming -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 85)">
    <!-- Stem -->
    <rect x="-3" y="-60" width="6" height="75" fill="#689f38"/>
    <!-- Leaves -->
    <ellipse cx="-12" cy="-40" rx="12" ry="18" fill="#7cb342" transform="rotate(-40)"/>
    <ellipse cx="12" cy="-40" rx="12" ry="18" fill="#8bc34a" transform="rotate(40)"/>
    <ellipse cx="-14" cy="-15" rx="14" ry="20" fill="#7cb342" transform="rotate(-45)"/>
    <ellipse cx="14" cy="-15" rx="14" ry="20" fill="#8bc34a" transform="rotate(45)"/>
    <!-- Flower petals -->
    <g transform="translate(0, -60)">
      <ellipse cx="0" cy="-12" rx="6" ry="12" fill="#ffd54f"/>
      <ellipse cx="8" cy="-8" rx="6" ry="12" fill="#ffca28" transform="rotate(45)"/>
      <ellipse cx="12" cy="0" rx="6" ry="12" fill="#ffd54f" transform="rotate(90)"/>
      <ellipse cx="8" cy="8" rx="6" ry="12" fill="#ffca28" transform="rotate(135)"/>
      <ellipse cx="0" cy="12" rx="6" ry="12" fill="#ffd54f" transform="rotate(180)"/>
      <ellipse cx="-8" cy="8" rx="6" ry="12" fill="#ffca28" transform="rotate(225)"/>
      <ellipse cx="-12" cy="0" rx="6" ry="12" fill="#ffd54f" transform="rotate(270)"/>
      <ellipse cx="-8" cy="-8" rx="6" ry="12" fill="#ffca28" transform="rotate(315)"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="8" fill="#8d6e63"/>
    </g>
  </g>
</svg>
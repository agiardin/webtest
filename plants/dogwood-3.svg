<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dogwood Stage 3: Full bloom -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 90)">
    <!-- Trunk -->
    <rect x="-5" y="-62" width="10" height="74" fill="#6d4c41"/>
    <!-- Large canopy -->
    <circle cx="0" cy="-62" r="26" fill="#558b2f"/>
    <circle cx="-15" cy="-60" r="20" fill="#689f38"/>
    <circle cx="15" cy="-60" r="20" fill="#7cb342"/>
    <circle cx="-10" cy="-48" r="16" fill="#7cb342"/>
    <circle cx="10" cy="-48" r="16" fill="#8bc34a"/>
    <circle cx="0" cy="-44" r="14" fill="#9ccc65"/>
    <!-- Multiple white flowers -->
    <g transform="translate(-12, -58)">
      <path d="M 0,-4 L 2,-1 L 4,0 L 2,1 L 0,4 L -2,1 L -4,0 L -2,-1 Z" fill="#ffffff" stroke="#f8bbd0" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="1" fill="#fff59d"/>
    </g>
    <g transform="translate(12, -62)">
      <path d="M 0,-4 L 2,-1 L 4,0 L 2,1 L 0,4 L -2,1 L -4,0 L -2,-1 Z" fill="#ffffff" stroke="#f8bbd0" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="1" fill="#fff59d"/>
    </g>
    <g transform="translate(0, -56)">
      <path d="M 0,-4 L 2,-1 L 4,0 L 2,1 L 0,4 L -2,1 L -4,0 L -2,-1 Z" fill="#ffffff" stroke="#f8bbd0" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="1" fill="#fff59d"/>
    </g>
    <g transform="translate(-6, -50)">
      <path d="M 0,-3 L 1.5,-0.75 L 3,0 L 1.5,0.75 L 0,3 L -1.5,0.75 L -3,0 L -1.5,-0.75 Z" fill="#ffffff" stroke="#f8bbd0" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="0.8" fill="#fff59d"/>
    </g>
    <g transform="translate(6, -50)">
      <path d="M 0,-3 L 1.5,-0.75 L 3,0 L 1.5,0.75 L 0,3 L -1.5,0.75 L -3,0 L -1.5,-0.75 Z" fill="#ffffff" stroke="#f8bbd0" stroke-width="0.4"/>
      <circle cx="0" cy="0" r="0.8" fill="#fff59d"/>
    </g>
  </g>
</svg>
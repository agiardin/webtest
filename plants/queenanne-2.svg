<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Queen Anne's Lace Stage 2: Budding -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 85)">
    <!-- Stem -->
    <rect x="-2" y="-50" width="4" height="65" fill="#7cb342"/>
    <!-- Feathery leaves -->
    <g transform="translate(-12, -30)">
      <path d="M 0,0 L -2,-4 L -4,-3 L -6,-6 L -8,-5" stroke="#81c784" stroke-width="2" fill="none"/>
      <path d="M 0,0 L 2,-4 L 4,-3 L 6,-6 L 8,-5" stroke="#81c784" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(12, -30)">
      <path d="M 0,0 L -2,-4 L -4,-3 L -6,-6 L -8,-5" stroke="#9ccc65" stroke-width="2" fill="none"/>
      <path d="M 0,0 L 2,-4 L 4,-3 L 6,-6 L 8,-5" stroke="#9ccc65" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(-14, -10)">
      <path d="M 0,0 L -2,-5 L -4,-4 L -6,-7 L -8,-6" stroke="#81c784" stroke-width="2" fill="none"/>
      <path d="M 0,0 L 2,-5 L 4,-4 L 6,-7 L 8,-6" stroke="#81c784" stroke-width="2" fill="none"/>
    </g>
    <!-- Flower bud cluster -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="4" fill="#e8f5e9"/>
      <circle cx="-3" cy="-2" r="3" fill="#f1f8e9"/>
      <circle cx="3" cy="-2" r="3" fill="#f1f8e9"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Daisy Stage 2: Budding -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 85)">
    <!-- Stem -->
    <rect x="-2" y="-45" width="4" height="60" fill="#7cb342"/>
    <!-- Leaves -->
    <ellipse cx="-10" cy="-30" rx="12" ry="16" fill="#81c784" transform="rotate(-40)"/>
    <ellipse cx="10" cy="-30" rx="12" ry="16" fill="#9ccc65" transform="rotate(40)"/>
    <ellipse cx="-12" cy="-10" rx="14" ry="18" fill="#81c784" transform="rotate(-45)"/>
    <ellipse cx="12" cy="-10" rx="14" ry="18" fill="#9ccc65" transform="rotate(45)"/>
    <!-- Flower bud -->
    <circle cx="0" cy="-45" r="6" fill="#ffeb3b"/>
  </g>
</svg>
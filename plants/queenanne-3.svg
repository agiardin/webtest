<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Queen Anne's Lace Stage 3: Full bloom -->
  <rect width="100" height="100" fill="none"/>
  <g transform="translate(50, 85)">
    <!-- Stem -->
    <rect x="-2" y="-55" width="4" height="70" fill="#7cb342"/>
    <!-- Feathery leaves -->
    <g transform="translate(-12, -35)">
      <path d="M 0,0 L -2,-4 L -4,-3 L -6,-6 L -8,-5" stroke="#81c784" stroke-width="2" fill="none"/>
      <path d="M 0,0 L 2,-4 L 4,-3 L 6,-6 L 8,-5" stroke="#81c784" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(12, -35)">
      <path d="M 0,0 L -2,-4 L -4,-3 L -6,-6 L -8,-5" stroke="#9ccc65" stroke-width="2" fill="none"/>
      <path d="M 0,0 L 2,-4 L 4,-3 L 6,-6 L 8,-5" stroke="#9ccc65" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(-14, -15)">
      <path d="M 0,0 L -2,-5 L -4,-4 L -6,-7 L -8,-6" stroke="#81c784" stroke-width="2" fill="none"/>
      <path d="M 0,0 L 2,-5 L 4,-4 L 6,-7 L 8,-6" stroke="#81c784" stroke-width="2" fill="none"/>
    </g>
    <!-- Lacy white flower cluster (umbel) -->
    <g transform="translate(0, -55)">
      <!-- Outer ring of tiny flowers -->
      <circle cx="0" cy="-10" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="-7" r="1.5" fill="#ffffff"/>
      <circle cx="10" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="7" r="1.5" fill="#ffffff"/>
      <circle cx="0" cy="10" r="1.5" fill="#ffffff"/>
      <circle cx="-7" cy="7" r="1.5" fill="#ffffff"/>
      <circle cx="-10" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="-7" cy="-7" r="1.5" fill="#ffffff"/>
      <!-- Middle ring -->
      <circle cx="0" cy="-6" r="1.5" fill="#ffffff"/>
      <circle cx="4" cy="-4" r="1.5" fill="#ffffff"/>
      <circle cx="6" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="4" cy="4" r="1.5" fill="#ffffff"/>
      <circle cx="0" cy="6" r="1.5" fill="#ffffff"/>
      <circle cx="-4" cy="4" r="1.5" fill="#ffffff"/>
      <circle cx="-6" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="-4" cy="-4" r="1.5" fill="#ffffff"/>
      <!-- Inner cluster -->
      <circle cx="0" cy="-3" r="1.5" fill="#ffffff"/>
      <circle cx="2" cy="-2" r="1.5" fill="#ffffff"/>
      <circle cx="3" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="2" cy="2" r="1.5" fill="#ffffff"/>
      <circle cx="0" cy="3" r="1.5" fill="#ffffff"/>
      <circle cx="-2" cy="2" r="1.5" fill="#ffffff"/>
      <circle cx="-3" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="-2" cy="-2" r="1.5" fill="#ffffff"/>
      <!-- Center (single dark floret) -->
      <circle cx="0" cy="0" r="1" fill="#5d4037"/>
    </g>
  </g>
</svg>